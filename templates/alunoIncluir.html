<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Aluno — Grip</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-zinc-100 px-4 py-10">
    <div class="max-w-xl mx-auto">

        <div class="mb-6">
            <nav class="text-sm text-zinc-400 mb-1">
                <a href="/logado" class="hover:text-indigo-500">Painel</a> /
                <a href="/alunoListar" class="hover:text-indigo-500">Alunos</a> / Novo
            </nav>
            <h1 class="text-2xl font-bold text-zinc-900">Novo Aluno</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6">
            <form action="/alunoIncluir" method="POST" class="space-y-4">

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">Nome</label>
                    <input type="text" name="nome" required
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">CPF</label>
                    <input type="text" name="cpf" placeholder="000.000.000-00"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">Telefone</label>
                    <input type="tel" name="telefone" placeholder="(41) 99999-9999"
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">E-mail</label>
                    <input type="email" name="email" required
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-1">Senha</label>
                    <input type="password" name="senha" required
                        class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit"
                        class="flex-1 bg-indigo-500 hover:bg-indigo-400 text-white font-medium py-2 rounded-lg text-sm">
                        Salvar
                    </button>
                    <a href="/alunoListar"
                        class="flex-1 text-center border border-zinc-300 text-zinc-600 hover:bg-zinc-50 font-medium py-2 rounded-lg text-sm">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
