<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trocar Senha Professor — Grip</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-zinc-100 flex items-center justify-center py-10">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm">
        <h1 class="text-2xl font-bold text-zinc-900 mb-2">Trocar Senha</h1>
        <p class="text-sm text-zinc-500 mb-6">Professor: <strong>{{ prof.nome }}</strong></p>

        <form action="/profSenha" method="POST">
            <input type="hidden" name="id" value="{{ prof.id }}">
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-zinc-700 mb-1" for="nova_senha">Nova Senha</label>
                <input type="password" name="nova_senha" id="nova_senha" required
                    class="w-full px-4 py-2 bg-zinc-50 border border-zinc-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="flex gap-3 justify-end mt-6">
                <a href="/profListar" class="px-4 py-2 text-sm text-zinc-600 hover:text-zinc-900">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-400 text-white text-sm font-medium rounded-lg">
                    Atualizar Senha
                </button>
            </div>
        </form>
    </div>
</body>
</html>
