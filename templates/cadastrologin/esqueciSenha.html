<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo_grip.svg" type="image/svg+xml">
    <title>Recuperar Senha — Grip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/stylesnavbar.css" />
    <link rel="stylesheet" href="/static/css/stylesfooter.css" />
    <link rel="stylesheet" href="/static/css/stylecadastro.css">
    <link rel="stylesheet" href="/static/css/stylemensagens.css">
</head>
<body class="auth-page">
    <div class="blur blur1"></div>
    <div class="blur blur2"></div>

    <header class="header">
        <div class="container nav">
            <a href="/" class="logo">
                <img src="/static/images/logo_grip.svg" alt="logo grip">
            </a>
            <nav class="navbar" aria-label="Navegação principal">
                <a href="/">Home</a>
                <a href="/aulas">Aulas</a>
                <a href="/professores">Professores</a>
                <a href="/planos">Planos</a>
                <a href="/sobre">Sobre</a>
            </nav>
            <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <a href="/login" class="btn btn-primary btn-sm">Entrar</a>
        </div>
    </header>

    <main class="main">
        <div class="logo-big">
            <img src="/static/images/logo_grip.svg" alt="Grip Logo">
        </div>

        <div class="card">
            <div class="card-top">
                <h2>Recuperar senha</h2>
                <p class="sub">Informe seu e-mail para redefinir o acesso</p>
            </div>

            {% if mensagem %}
            <div class="campo-erro visivel" style="margin-bottom: 1rem; text-align: center;">{{ mensagem }}</div>
            {% endif %}

            <form id="esqueciForm" action="/esqueci-senha" method="POST" class="form" novalidate>
                <div class="campo">
                    <label for="email">E-mail <span class="required-indicator">*</span></label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    <span class="campo-erro" id="erro-email"></span>
                </div>

                <div class="campo">
                    <label>Tipo de conta <span class="required-indicator">*</span></label>
                    <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                            <input type="radio" name="tipo" value="aluno" checked> Aluno
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                            <input type="radio" name="tipo" value="professor"> Professor
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Continuar</button>
            </form>

            <p class="link" style="margin-top: 1.2rem; text-align: center;">
                <a href="/login">← Voltar ao login</a>
            </p>
        </div>

        <p class="copy">© 2026 Grip Ballet Academy. Todos os direitos reservados.</p>
    </main>

    <script>
    document.getElementById('esqueciForm').addEventListener('submit', function(e) {
        const email = document.getElementById('email');
        const erro = document.getElementById('erro-email');
        if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
            e.preventDefault();
            erro.textContent = 'Informe um e-mail válido.';
            erro.classList.add('visivel');
        } else {
            erro.textContent = '';
            erro.classList.remove('visivel');
        }
    });
    </script>
    <script src="/static/js/main.js"></script>
</body>
</html>
