<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Aula — Grip</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-zinc-100 px-4 py-10">
    <div class="max-w-md mx-auto">

        <div class="mb-6">
            <nav class="text-sm text-zinc-400 mb-1">
                <a href="/logado" class="hover:text-indigo-500">Painel</a> /
                <a href="/aulaListar" class="hover:text-indigo-500">Aulas</a> / Excluir
            </nav>
            <h1 class="text-2xl font-bold text-zinc-900">Excluir Aula</h1>
        </div>

        <div class="bg-white rounded-2xl shadow-sm p-6">
            <p class="text-zinc-600 mb-4">Tem certeza que deseja excluir a aula abaixo?</p>

            <div class="bg-zinc-50 rounded-xl p-4 space-y-2 text-sm mb-6">
                <div><span class="font-medium text-zinc-700">Nome:</span> {{ aula.nome }}</div>
                <div><span class="font-medium text-zinc-700">Professor:</span> {{ aula.professor_nome or "-" }}</div>
                <div><span class="font-medium text-zinc-700">Descrição:</span> {{ aula.descricao }}</div>
            </div>

            <form action="/aulaExcluir" method="POST" class="flex gap-3">
                <input type="hidden" name="id" value="{{ aula.id }}">
                <button type="submit"
                    class="flex-1 bg-red-500 hover:bg-red-400 text-white font-medium py-2 rounded-lg text-sm">
                    Confirmar Exclusão
                </button>
                <a href="/aulaListar"
                    class="flex-1 text-center border border-zinc-300 text-zinc-600 hover:bg-zinc-50 font-medium py-2 rounded-lg text-sm">
                    Cancelar
                </a>
            </form>
        </div>

    </div>
</body>
</html>
