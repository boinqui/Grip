{% if mensagem %}
<div class="modal-overlay aberto" id="globalModal">
    <div class="modal-card">
        <button class="modal-close" onclick="fecharModal()">&times;</button>

        <div id="modalStatusContainer" class="msg-status {% if 'Erro' in mensagem or 'inválido' in mensagem or 'erro' == status %}msg-error{% else %}msg-info{% endif %}">
            <div class="msg-ic" id="modalIcon">{% if 'Erro' in mensagem or 'inválido' in mensagem or 'erro' == status %}!{% else %}✓{% endif %}</div>
            <div class="msg-txt">
                <h4 id="modalTitle">{% if 'Erro' in mensagem or 'inválido' in mensagem or 'erro' == status %}Erro{% else %}Sucesso{% endif %}</h4>
                <p id="modalDescription">{{ mensagem }}</p>
            </div>
        </div>

        <div class="confirmar" style="border-top: none; margin-top: 20px;">
            <button class="btn btn-primary btn-block" id="modalActionButton"
                onclick="fecharModal()">Entendi</button>
        </div>
    </div>
</div>

<script>
    function fecharModal() {
        const modal = document.getElementById('globalModal');
        if (modal) {
            modal.classList.remove('aberto');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }
    }

    window.onclick = function(event) {
        const modal = document.getElementById('globalModal');
        if (event.target == modal) {
            fecharModal();
        }
    }
</script>
{% endif %}
